name: ciCheck

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciCheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep workflow and job names stable so branch protection can require this check context.
  ciCheck:
    name: ciCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Optional Hytale packaging verification
        env:
          HYTALE_HOME: ${{ vars.HYTALE_HOME }}
        run: |
          if [ -z "${HYTALE_HOME}" ]; then
            echo "HYTALE_HOME is not set; skipping optional Hytale packaging verification."
            exit 0
          fi

          JAR_PATH="${HYTALE_HOME}/install/release/package/game/latest/Server/HytaleServer.jar"
          if [ ! -f "${JAR_PATH}" ]; then
            echo "HytaleServer.jar not found at ${JAR_PATH}; skipping optional Hytale packaging verification."
            exit 0
          fi

          ./gradlew hytaleJar verifyHytaleJarMainClass verifyHytaleJarUiAssets --no-daemon -Phytale_home="${HYTALE_HOME}"
