name: Repo Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  repo-contract:
    name: repo-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status

      - name: Verify repo contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./scripts/verify-repo-contract.sh
          ./scripts/verify-repo-contract.sh
